[package]
name = "paybond-evidence"
version = "0.1.0"
description = "Canonical evidence payload hashing and payee binding signatures shared by Harbor and Paybond Kit."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nonameuserd/paybond-kit-python.git"

[features]
default = ["sign"]
sign = ["dep:base64", "dep:ed25519-dalek", "dep:hex", "dep:thiserror"]

[dependencies]
base64 = { version = "0.22", optional = true }
bincode = "1.3"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["serde"], optional = true }
hex = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", optional = true }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "serde-well-known"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace]
