[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "paybond-kit"
version = "0.10.0"
description = "Paybond Kit for Python: agent spend governance for paid tool calls with spend authorization, evidence receipts, refunds, disputes, hosted Gateway sessions, and settlement."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
  "paybond",
  "harbor",
  "kit",
  "agents",
  "agent-runtime",
  "agent-spend-governance",
  "agent-spend-controls",
  "ai-agent-budget",
  "paid-tool-calls",
  "spend-authorization",
  "evidence-receipts",
  "refunds",
  "disputes",
  "delegated-spend",
  "spend-guardrails",
  "tool-call-spend-limits",
  "gemini",
  "claude",
  "anthropic",
  "agent-payments",
  "escrow",
  "intent-escrow",
  "capabilities",
  "capability-verification",
  "tenant-bound",
  "x402",
  "usdc",
  "mcp",
  "reputation",
  "python",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/nonameuserd/paybond-kit-python"
Documentation = "https://github.com/nonameuserd/paybond-kit-python"
Repository = "https://github.com/nonameuserd/paybond-kit-python.git"
Issues = "https://github.com/nonameuserd/paybond-kit-python/issues"

[project.scripts]
paybond = "paybond_kit.cli.router:main"
paybond-kit-login = "paybond_kit.login:main"
paybond-kit-init = "paybond_kit.init:main"
paybond-mcp-server = "paybond_kit.mcp_server:main"

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.50", "langchain-core>=0.3.0"]
mcp = ["mcp>=1.27,<2"]
dev = [
  "mcp>=1.27,<2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "langgraph>=0.2.50",
  "langchain-core>=0.3.0",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "paybond_kit._native"
python-source = "src"
include = ["LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
