[package]
name = "paybond_kit_native"
version = "0.11.1"
edition = "2021"
publish = false
description = "Native signing extension for paybond-kit Python releases."
license = "Apache-2.0"
repository = "https://github.com/nonameuserd/paybond-kit-python.git"
homepage = "https://github.com/nonameuserd/paybond-kit-python"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["serde"] }
hex = "0.4"
paybond-evidence = { path = "../vendor/paybond-evidence", default-features = true }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
hex = "0.4"
